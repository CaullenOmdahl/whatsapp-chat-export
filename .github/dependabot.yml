version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # jsdom is the only runtime-adjacent dependency (tests only). Keep the noise low
    # and never let a dependency PR touch the shipped extension code silently.
    groups:
      dev-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
